<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Avoid the Brodie Kemp Badge</title>
<style>
  :root {
    --ink:#0c1730;
    --panel:#ffffffee;
    --accent:#1f6feb;
    --danger:#e63946;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; background:#07111f; font-family:Arial,Helvetica,sans-serif; overflow:hidden; }
  body { display:grid; place-items:center; }
  #wrap {
    width:min(1100px,100vw);
    height:min(760px,100vh);
    position:relative;
    background:linear-gradient(#8bd3ff 0 58%, #75c46b 58% 100%);
    border:6px solid #111b2d;
    box-shadow:0 0 40px #0008;
    overflow:hidden;
    user-select:none;
    touch-action:none;
  }
  #game { width:100%; height:100%; display:block; touch-action:none; }
  #hud {
    position:absolute; inset:14px 14px auto 14px;
    display:flex; justify-content:space-between; gap:10px; pointer-events:none;
    font-weight:900; font-size:20px;
  }
  .pill {
    background:var(--panel); color:var(--ink); border:3px solid var(--ink);
    border-radius:999px; padding:8px 14px; box-shadow:0 3px 0 #0003;
  }
  #title {
    position:absolute; left:50%; top:12px; transform:translateX(-50%);
    background:#fff; border:3px solid #101827; border-radius:16px; padding:8px 15px;
    font-size:clamp(18px,2.6vw,30px); font-weight:1000; white-space:nowrap;
    box-shadow:0 4px 0 #0003;
  }
  #overlay {
    position:absolute; inset:0; display:grid; place-items:center;
    background:#07111fc9; z-index:5;
  }
  #card {
    width:min(650px,88%); text-align:center; background:#fff; border:5px solid #111b2d;
    border-radius:22px; padding:24px; color:#0c1730; box-shadow:0 14px 50px #0009;
  }
  #card h1 { margin:0 0 10px; font-size:clamp(28px,5vw,52px); line-height:1; }
  #card p { font-size:18px; margin:10px 0; }
  button {
    cursor:pointer; border:0; border-radius:14px; background:#ffd43b; color:#101827;
    font-weight:1000; font-size:22px; padding:13px 24px; margin-top:10px;
    box-shadow:0 5px 0 #b88700;
  }
  button:active { transform:translateY(3px); box-shadow:0 2px 0 #b88700; }
  .small { font-size:14px !important; opacity:.72; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1100" height="760"></canvas>
  <div id="title">AVOID THE BRODIE KEMP BADGE</div>
  <div id="hud">
    <div class="pill">Score: <span id="score">0</span></div>
    <div class="pill">High score: <span id="high">0</span></div>
  </div>
  <div id="overlay">
    <div id="card">
      <h1>🏃 Smootwo, RUN!</h1>
      <p>Avoid the <b>Brodie Kemp badge</b>.</p>
      <p>Collect <b>Atar 💧</b> for +10 and <b>Putbar 🥜</b> for +25.</p>
      <p>Move with <b>WASD</b>, <b>arrow keys</b>, or on mobile by <b>tapping the screen</b> in the direction you want Smootwo to go.</p>
      <button id="startBtn">START GAME</button>
      <p class="small">The badge gets faster as your score rises.</p>
    </div>
  </div>
</div>

let mobileMove = {active:false, dx:0, dy:0, lastTapX:null, lastTapY:null};

function fitCanvas() {
  const rect = wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width*dpr);
  canvas.height = Math.round(rect.height*dpr);
  canvas.style.width = rect.width+"px";
  canvas.style.height = rect.height+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W=rect.width; H=rect.height;
}
window.addEventListener('resize',fitCanvas); fitCanvas();

addEventListener('keydown', e => {
  const k=e.key.toLowerCase(); keys[k]=true;
  mobileMove.active = false;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()]=false);

function setMobileDirectionFromEvent(e) {
  if(gameState !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const dx = x - player.x;
  const dy = y - player.y;
  const dist = Math.hypot(dx,dy);
  mobileMove.lastTapX = x;
  mobileMove.lastTapY = y;
  if(dist < 16) {
    mobileMove.active = false;
    mobileMove.dx = 0;
    mobileMove.dy = 0;
    return;
  }
  mobileMove.active = true;
  mobileMove.dx = dx / dist;
  mobileMove.dy = dy / dist;
}

canvas.addEventListener('pointerdown', e => {
  if(!running || gameState !== 'playing') return;
  setMobileDirectionFromEvent(e);
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if(!running || gameState !== 'playing') return;
  if(e.pointerType === 'touch' && e.buttons !== 0) {
    setMobileDirectionFromEvent(e);
    e.preventDefault();
  }
});

function reset() {
  score=0; scoreEl.textContent=0;
  player.x=W*.17; player.y=H*.72;
  enemy.x=W*.82; enemy.y=H*.26;
  enemy.speed=135;
  gameState='playing';
  cryTimer=0;
  items=[]; particles=[]; tears=[];
  mobileMove = {active:false, dx:0, dy:0, lastTapX:null, lastTapY:null};
  spawnItem('atar'); spawnItem('putbar');
}

function spawnItem(type) {
  let tries=0,x,y;
  do {
    x=70+Math.random()*(W-140);
    y=110+Math.random()*(H-180);
    tries++;
  } while(tries<40 && (Math.hypot(x-player.x,y-player.y)<150 || Math.hypot(x-enemy.x,y-enemy.y)<120));
  items.push({type,x,y,r:type==='atar'?24:28,bob:Math.random()*Math.PI*2});
}

function startGame() {
  reset();
  running=true;
  overlay.style.display='none';
  last=performance.now();
  requestAnimationFrame(loop);
}
startBtn.onclick=startGame;

function startCryAnimation() {
  if(gameState !== 'playing') return;
  gameState='crying';
  cryTimer=1.7;
  burst(player.x, player.y-8, '💧');
}

function finishGameOver() {
  running=false;
  if(score>high) {
    high=score; localStorage.setItem('smootwoHigh',high); highEl.textContent=high;
  }
  overlay.style.display='grid';
  card.innerHTML = `
    <h1>💥 GAME OVER</h1>
    <p>The Brodie Kemp badge caught Smootwo!</p>
    <p>Smootwo is crying 😭</p>
    <p style="font-size:28px"><b>Score: ${score}</b></p>
    <button id="again">PLAY AGAIN</button>
    <p class="small">Atar = +10 · Putbar = +25</p>`;
  document.getElementById('again').onclick=startGame;
}

function hit(a,b,bonus=0) {
  return Math.hypot(a.x-b.x,a.y-b.y) < a.r+b.r-bonus;
}

function burst(x,y,emoji) {
  for(let i=0;i<10;i++) particles.push({
    x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180-50,
    life:.65,emoji
  });
}

function spawnCryTears() {
  const leftEye = {x: player.x - 11, y: player.y - 18};
  const rightEye = {x: player.x + 11, y: player.y - 18};
  for(const eye of [leftEye, rightEye]) {
    tears.push({
      x: eye.x + (Math.random() - .5) * 4,
      y: eye.y + (Math.random() - .5) * 2,
      vx: (Math.random() - .5) * 18,
      vy: 80 + Math.random() * 55,
      life: .9 + Math.random() * .25,
      size: 7 + Math.random() * 5
    });
  }
}

function update(dt) {
  if(gameState === 'playing') {
    let dx=0,dy=0;
    if(keys['arrowleft']||keys['a']) dx--;
    if(keys['arrowright']||keys['d']) dx++;
    if(keys['arrowup']||keys['w']) dy--;
    if(keys['arrowdown']||keys['s']) dy++;
    if(dx||dy) {
      const m=Math.hypot(dx,dy); dx/=m; dy/=m;
    } else if(mobileMove.active) {
      dx = mobileMove.dx;
      dy = mobileMove.dy;
    }
    if(dx||dy) {
      player.x += dx*player.speed*dt; player.y += dy*player.speed*dt;
    }
    player.x=Math.max(player.r,Math.min(W-player.r,player.x));
    player.y=Math.max(92+player.r,Math.min(H-player.r,player.y));

    // Brodie badge chases Smootwo, with a tiny wobble so it feels arcade-like.
    let ex=player.x-enemy.x, ey=player.y-enemy.y;
    let em=Math.hypot(ex,ey)||1; ex/=em; ey/=em;
    const wob=Math.sin(performance.now()/350)*.2;
    enemy.x += (ex - ey*wob)*enemy.speed*dt;
    enemy.y += (ey + ex*wob)*enemy.speed*dt;
    enemy.speed = 135 + Math.min(190, score*1.25);

    if(hit(player,enemy,8)) startCryAnimation();

    for(let i=items.length-1;i>=0;i--) {
      const it=items[i]; it.bob += dt*3;
      if(hit(player,it,5)) {
        const gain=it.type==='atar'?10:25;
        score+=gain; scoreEl.textContent=score;
        burst(it.x,it.y,it.type==='atar'?'💧':'🥜');
        items.splice(i,1);
        setTimeout(()=>running&&gameState==='playing'&&spawnItem(it.type),280);
      }
    }
  } else if(gameState === 'crying') {
    cryTimer -= dt;
    if(Math.random() < .72) spawnCryTears();
    if(Math.random() < .16) burst(player.x + (Math.random()-.5)*20, player.y+10, '💧');
    if(cryTimer <= 0) return finishGameOver();
  }

  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.life-=dt;});
  particles=particles.filter(p=>p.life>0);
  tears.forEach(t=>{t.x+=t.vx*dt; t.y+=t.vy*dt; t.vy+=250*dt; t.life-=dt;});
  tears=tears.filter(t=>t.life>0 && t.y < H + 30);
}

function roundedImage(img,x,y,w,h,r) {
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x-w/2,y-h/2,w,h,r); ctx.clip();
  ctx.drawImage(img,x-w/2,y-h/2,w,h);
  ctx.restore();
}

function drawBackground() {
  // sky
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#82d7ff'); grd.addColorStop(.58,'#d7f4ff');
  grd.addColorStop(.581,'#77c76d'); grd.addColorStop(1,'#4b9a4c');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);

  // clouds
  ctx.fillStyle='#ffffffb8';
  for(const c of [[120,135,70],[420,175,55],[800,130,78],[1020,205,45]]) {
    ctx.beginPath();ctx.arc(c[0],c[1],c[2]*.45,0,Math.PI*2);
    ctx.arc(c[0]+c[2]*.45,c[1]+5,c[2]*.36,0,Math.PI*2);
    ctx.arc(c[0]-c[2]*.4,c[1]+10,c[2]*.3,0,Math.PI*2);ctx.fill();
  }

  // field lines
  ctx.strokeStyle='#fff9'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(W*.5,H*.59); ctx.lineTo(W*.5,H); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(W*.5,H*.79,95,58,0,0,Math.PI*2); ctx.stroke();
}

function draw() {
  ctx.clearRect(0,0,W,H); drawBackground();

  // collectibles
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const it of items) {
    const yy=it.y+Math.sin(it.bob)*6;
    ctx.save(); ctx.shadowColor='#0005';ctx.shadowBlur=8;ctx.shadowOffsetY=4;
    if(it.type==='atar') {
      ctx.font='48px Arial'; ctx.fillText('💧',it.x,yy);
      ctx.font='900 15px Arial'; ctx.fillStyle='#073b74'; ctx.fillText('ATAR',it.x,yy+38);
    } else {
      ctx.font='48px Arial'; ctx.fillText('🥜',it.x,yy);
      ctx.font='900 15px Arial'; ctx.fillStyle='#5b2a00'; ctx.fillText('PUTBAR',it.x,yy+38);
    }
    ctx.restore();
  }

  // optional mobile tap marker
  if(gameState === 'playing' && mobileMove.active && mobileMove.lastTapX !== null) {
    ctx.save();
    ctx.strokeStyle='#ffffffcc';
    ctx.lineWidth=3;
    ctx.setLineDash([8,8]);
    ctx.beginPath();
    ctx.arc(mobileMove.lastTapX, mobileMove.lastTapY, 18, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // Smootwo
  ctx.save(); ctx.shadowColor='#0007';ctx.shadowBlur=12;ctx.shadowOffsetY=6;
  roundedImage(smootwoImg,player.x,player.y,78,92,20);
  ctx.restore();
  if(gameState === 'crying') {
    // animated "GIF-style" tears and a sad mouth overlay
    ctx.save();
    ctx.strokeStyle = '#188bff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(player.x-9, player.y-11);
    ctx.lineTo(player.x-13, player.y+12 + Math.sin(performance.now()/80)*2);
    ctx.moveTo(player.x+9, player.y-11);
    ctx.lineTo(player.x+13, player.y+12 + Math.cos(performance.now()/80)*2);
    ctx.stroke();
    ctx.fillStyle = '#1b84ffdd';
    ctx.beginPath(); ctx.ellipse(player.x-13, player.y+16, 5, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(player.x+13, player.y+16, 5, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#16324f';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(player.x, player.y+7, 11, Math.PI*1.08, Math.PI*1.92);
    ctx.stroke();
    ctx.font='900 18px Arial';
    ctx.fillStyle='#ffffff';
    ctx.strokeStyle='#0c1730';
    ctx.lineWidth=4;
    ctx.strokeText('NOOO!', player.x, player.y-70);
    ctx.fillText('NOOO!', player.x, player.y-70);
    ctx.restore();
  }
  ctx.font='900 15px Arial'; ctx.fillStyle='#07111f';
  ctx.fillText('SMOOTWO',player.x,player.y+58);

  // Brodie badge
  ctx.save();
  ctx.translate(enemy.x,enemy.y);
  ctx.rotate(Math.sin(performance.now()/140)*.055 + (gameState==='crying' ? .05 : 0));
  ctx.shadowColor='#e90000aa';ctx.shadowBlur=22;
  ctx.beginPath();ctx.arc(0,0,enemy.r+4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.drawImage(badgeImg,-enemy.r,-enemy.r,enemy.r*2,enemy.r*2);
  ctx.restore();

  // free-falling tears
  tears.forEach(t=>{
    ctx.save();
    ctx.globalAlpha=Math.max(0, Math.min(1, t.life));
    ctx.fillStyle='#1e90ff';
    ctx.beginPath();
    ctx.moveTo(t.x, t.y - t.size*.8);
    ctx.quadraticCurveTo(t.x + t.size*.72, t.y - t.size*.15, t.x + t.size*.28, t.y + t.size*.62);
    ctx.quadraticCurveTo(t.x, t.y + t.size, t.x - t.size*.28, t.y + t.size*.62);
    ctx.quadraticCurveTo(t.x - t.size*.72, t.y - t.size*.15, t.x, t.y - t.size*.8);
    ctx.fill();
    ctx.restore();
  });

  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/.65);
    ctx.font='24px Arial';ctx.fillText(p.emoji,p.x,p.y);
  });
  ctx.globalAlpha=1;
}

function loop(t) {
  if(!running) return;
  const dt=Math.min(.033,(t-last)/1000); last=t;
  update(dt); draw();
  if(running) requestAnimationFrame(loop);
}
draw();
</script>
</body>
</html>
